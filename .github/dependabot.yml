# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
      production-dependencies:
        dependency-type: "production"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The AI SDK v3→v4 migration is deliberately excluded (see issue
      # tracker). This ignores ALL @ai-sdk/* and ai updates, not just majors:
      # already-v4 packages (amazon-bedrock, google-vertex) pull provider@4 /
      # provider-utils@5 transitively and break the pinned v3 runtime.
      - dependency-name: "@ai-sdk/*"
      - dependency-name: "ai"
      # These two non-@ai-sdk/ providers are v4-aligned: @openrouter/ai-sdk-provider
      # >=3.0.0 requires ai@^7 and ai-gateway-provider >=4.0.0 requires
      # @ai-sdk/provider@^4 / provider-utils@^5, dragging in the v4 stack.
      - dependency-name: "@openrouter/ai-sdk-provider"
      - dependency-name: "ai-gateway-provider"
      # Effect is pinned via the root catalog (effect 4.0.0-beta.83). Bumping
      # @effect/platform-node etc. alone drifts the beta stack and breaks the
      # build (beta.104 requires effect@^4.0.0-beta.104); bump catalog + packages
      # together as a deliberate change.
      - dependency-name: "@effect/*"
      - dependency-name: "effect"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
