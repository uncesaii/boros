name: release

run-name: ${{ format('release v{0}', github.ref_name) }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (without v)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REF: ${{ github.ref }}
      - name: Create release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release view "$TAG" --repo "${GH_REPO}" >/dev/null 2>&1 && echo "release already exists" || \
            gh release create "$TAG" --repo "${GH_REPO}" \
              --title "Boros $TAG" --notes "Automated release from tag $TAG."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build all platform binaries and publish release
        run: |
          BOROS_CHANNEL=latest \
          BOROS_VERSION="${{ steps.version.outputs.version }}" \
          BOROS_RELEASE=1 \
          GH_REPO="${GH_REPO}" \
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
          bun run --cwd packages/opencode script/build.ts --skip-embed-web-ui
      - name: Verify release assets exist
        run: |
          ls -la dist/ 2>/dev/null || true
          gh release view "${{ steps.version.outputs.tag }}" --repo "${GH_REPO}" --json name,assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
