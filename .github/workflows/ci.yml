name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun typecheck
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: "--frozen-lockfile"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo test
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: false
      - name: HttpApi exerciser gates
        working-directory: packages/opencode
        run: bun run test:httpapi
  build:
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build native binary (linux x64 smoke)
        run: |
          OPENCODE_CHANNEL=latest OPENCODE_VERSION="1.0.0" \
            bun run --cwd packages/opencode script/build.ts --single --skip-embed-web-ui
      - name: Smoke test binary
        run: |
          BIN=$(ls packages/opencode/dist/boros-*/bin/boros 2>/dev/null | head -1)
          echo "binary: $BIN"
          "$BIN" --version
