name: boros-review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  boros-review:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write
    name: boros-review
    steps:
      - name: boros-review action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.BOROS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.BOROS_TOKEN }}
          # GitHub Models (OpenAI-compatible) endpoint
          OPENAI__API_BASE: "https://models.github.ai/inference/v1"
          OPENAI__KEY: ${{ secrets.BOROS_TOKEN }}
          # Model selection for code review
          config.model: "openai/gpt-4.1"
          config.fallback_models: '["openai/gpt-4o-mini"]'
          config.ai_timeout: "300"
          # The review bot identity
          bot.name: "boros-review"
          bot.trigger_phrase: "review"
          # Automatic tools — CodeRabbit-style flow: review on open and every push
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
          # Auto-approve when the review is clean
          github_action_config.enable_auto_approval: "true"
          pr_reviewer.enable_auto_approval: "true"
          pr_reviewer.auto_approval_behavior: "all"
          pr_reviewer.max_reviews_per_request: "2"
          # Thorough, CodeRabbit-grade review
          config.prompt.review_effort: "5"
          config.prompt.use_description_score: "false"
